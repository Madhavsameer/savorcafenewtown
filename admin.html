<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard — Savor Cafe'</title><link rel="stylesheet" href="/style.css"></head><body class="admin-page"><header class="navbar"><div class="nav-inner"><a class="brand" href="/index.html"><span class="brand-logo"><img src="/logo.png" alt=""><i>S</i></span><span>Savor Cafe'</span></a><div class="nav-actions"><a class="cart-btn" href="/index.html">← Site</a></div></div></header><main><section class="simple-hero"><div class="container"><span class="eyebrow">SAVOR CAFE' · ADMIN</span><h1>Daily <em>dashboard.</em></h1><p>Local orders and customers stored in this browser.</p></div></section><div class="container admin-wrap"><section class="auth-card" id="adminLogin"><span class="eyebrow">ADMIN LOGIN</span><h2>Sign in</h2><form><label>Username<input name="adminUser" value="admin" autocomplete="username"></label><label>Password<input name="adminPass" type="password" placeholder="Admin password"></label><button class="btn primary full" type="submit">Open dashboard →</button><p id="adminMsg" class="form-note"></p></form></section><section id="adminDashboard" hidden><div class="admin-top"><div><span class="eyebrow">TODAY</span><h2>Business snapshot</h2></div><div class="admin-actions"><button class="btn ghost" id="exportUsers">Export auth.xls</button><button class="btn ghost" id="exportOrders">Export orders.xls</button><button class="btn ghost" id="adminLogout">Logout</button></div></div><div class="stats-grid"><article><span>Today's orders</span><strong id="adminTodayOrders">0</strong></article><article><span>Today's sales</span><strong id="adminTodaySales">₹0</strong></article><article><span>Customers</span><strong id="adminCustomers">0</strong></article><article><span>All orders</span><strong id="adminAllOrders">0</strong></article></div><section class="admin-table-card"><div class="section-head"><div><span class="eyebrow">ORDER BOOK</span
